<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05090d">
  <meta name="color-scheme" content="dark">
  <title>Sky Drift</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <canvas id="scene" style="touch-action:none" aria-hidden="true"></canvas>

  <!-- ============================================================
       HUD  —  all shapes drawn with CSS gradients, masks,
       conic wedges, clip-paths and a small SVG gauge.
       ============================================================ -->
  <div id="hud">

    <!-- ambient overlays -->
    <div class="fx fx-vignette" aria-hidden="true"></div>
    <div class="fx fx-scanlines" aria-hidden="true"></div>

    <div class="fx-lens" id="lensflare" aria-hidden="true">
      <i class="lens-core"></i>
      <i class="lens-halo"></i>
      <i class="lens-ghost g1"></i>
      <i class="lens-ghost g2"></i>
      <i class="lens-ghost g3"></i>
      <i class="lens-streak"></i>
    </div>

    <!-- corner brackets -->
    <span class="bracket tl" aria-hidden="true"></span>
    <span class="bracket tr" aria-hidden="true"></span>
    <span class="bracket bl" aria-hidden="true"></span>
    <span class="bracket br" aria-hidden="true"></span>

    <!-- ==================== AIRSPEED GAUGE ==================== -->
    <section class="gauge speedo" id="speedo">
      <span class="ring ring-a"></span>
      <span class="ring ring-b"></span>
      <span class="ring ring-c"></span>

      <svg class="dial" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="gradSpeed" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#3ce9ff"/>
            <stop offset="55%" stop-color="#a6f7ff"/>
            <stop offset="100%" stop-color="#ffb547"/>
          </linearGradient>
          <linearGradient id="gradRed" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff6a3a"/>
            <stop offset="100%" stop-color="#ff2a2a"/>
          </linearGradient>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="3.2" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- 270° arc from 135° → 45°, r = 80, centre (100,100) -->
        <path class="arc-bg" d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"/>
        <!-- redline: same radius as the track, ends at the top of the scale -->
        <path class="arc-red" d="M 130.77 26.15 A 80 80 0 0 1 156.57 156.57"/>
        <path class="arc-fill" id="arcFill" stroke-dasharray="377"
              d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"/>
      </svg>

      <span class="ticks ticks-minor" aria-hidden="true"></span>
      <span class="ticks ticks-major" aria-hidden="true"></span>

      <span class="needle" id="needle" aria-hidden="true"><i></i></span>
      <span class="hub" aria-hidden="true"></span>

      <div class="readout">
        <span class="value" id="speedValue">0</span>
        <span class="unit">KTS</span>
      </div>
      <div class="mach">MACH <b id="machValue">0.00</b></div>
      <div class="caption">AIRSPEED</div>
    </section>

    <!-- ==================== ALTITUDE TAPE ==================== -->
    <section class="alt">
      <div class="alt-window">
        <div class="alt-strip" id="altStrip"></div>
      </div>
      <span class="alt-pointer" aria-hidden="true"></span>
      <div class="alt-num">
        <span id="altValue">0</span><i>FT</i>
      </div>
      <div class="alt-vs"><span id="vsValue">+0</span><i>FPM</i></div>
      <div class="caption v">ALT</div>
    </section>

    <!-- ==================== ATTITUDE BALL ==================== -->
    <section class="attitude" id="attitude">
      <div class="att-sphere" id="attSphere">
        <div class="att-sky"></div>
        <div class="att-ground"></div>
        <div class="att-ladder">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="att-glow"></div>
      </div>
      <span class="att-frame" aria-hidden="true"></span>
      <span class="att-wing" aria-hidden="true"></span>
      <span class="att-dot" aria-hidden="true"></span>
      <div class="caption v">ATTITUDE</div>
    </section>

    <!-- ==================== COMPASS RIBBON ==================== -->
    <section class="compass">
      <div class="compass-window">
        <div class="compass-strip" id="compassStrip"></div>
      </div>
      <span class="compass-mark" aria-hidden="true"></span>
      <div class="compass-num"><span id="hdgValue">000</span>°</div>
    </section>

    <!-- ==================== THROTTLE / BOOST ==================== -->
    <section class="power">
      <div class="pwr-head">
        <span class="pwr-cap">THROTTLE</span>
        <span class="pwr-num" id="thrValue">0%</span>
      </div>
      <div class="pwr-bar">
        <span class="pwr-fill" id="thrFill"></span>
        <span class="pwr-notches" aria-hidden="true"></span>
      </div>
      <div class="hex-row" id="hexRow" aria-hidden="true">
        <span class="hex"></span><span class="hex"></span><span class="hex"></span>
        <span class="hex"></span><span class="hex"></span><span class="hex"></span>
      </div>
      <div class="pwr-cap small">AFTERBURNER</div>
    </section>

    <!-- ==================== STATUS ==================== -->
    <section class="status">
      <div class="st-line"><b>SYS</b><span class="ok" id="sysState">NOMINAL</span></div>
      <div class="st-line"><b>G</b><span id="gValue">1.0</span></div>
      <div class="st-line"><b>V/S</b><span id="vsValue2">+0</span></div>
      <div class="st-line"><b>TIME</b><span id="timeValue">00:00</span></div>
    </section>

    <!-- ==================== HINT ==================== -->
    <div id="hint">
      <span class="hint-main">DRAG TO FLY</span>
      <span class="hint-sub">HOLD <b>SHIFT</b> / <b>TWO FINGERS</b> FOR AFTERBURNER</span>
    </div>

  </div>

  <!-- ============================================================
       DEMO DRIVER  —  replace with your own game.js later.
       Wires up the HUD so all animations come alive immediately.
       ============================================================ -->
  <script>
  (function () {
    "use strict";

    /* ---------------------------------------------------------
       Element cache (looked up once, never per frame)
       --------------------------------------------------------- */
    var $ = function (id) { return document.getElementById(id); };

    var canvas       = $('scene'),
        hud          = $('hud'),
        lens         = $('lensflare'),
        hint         = $('hint'),
        altStrip     = $('altStrip'),
        compassStrip = $('compassStrip'),
        needle       = $('needle'),
        arcFill      = $('arcFill'),
        speedValue   = $('speedValue'),
        machValue    = $('machValue'),
        altValue     = $('altValue'),
        vsValue      = $('vsValue'),
        vsValue2     = $('vsValue2'),
        hdgValue     = $('hdgValue'),
        attSphere    = $('attSphere'),
        attitude     = $('attitude'),
        thrFill      = $('thrFill'),
        thrValue     = $('thrValue'),
        gValue       = $('gValue'),
        timeValue    = $('timeValue'),
        sysState     = $('sysState');

    var hexes = Array.prototype.slice.call(document.querySelectorAll('#hexRow .hex'));

    /* ---------------------------------------------------------
       Constants
       --------------------------------------------------------- */
    var PX_PER_FT  = 0.22;
    var ALT_MIN    = -1000, ALT_MAX = 30000, ALT_STEP = 100;
    var PX_PER_DEG = 4;
    var SPEED_MIN  = 60, SPEED_MAX = 420;
    var ARC_LEN    = 377;              /* 270° arc, r = 80  →  80 · 1.5π */

    /* ---------------------------------------------------------
       Build the tapes once, off-document (single reflow)
       --------------------------------------------------------- */
    (function buildAltitudeTape() {
      var frag = document.createDocumentFragment();
      for (var a = ALT_MIN; a <= ALT_MAX; a += ALT_STEP) {
        var maj = (a % 500 === 0);
        var el = document.createElement('div');
        el.className = 'tick ' + (maj ? 'maj' : 'min');
        el.style.top = (-a * PX_PER_FT).toFixed(1) + 'px';
        if (maj) el.textContent = a;
        frag.appendChild(el);
      }
      altStrip.appendChild(frag);
    })();

    (function buildCompassRibbon() {
      var frag = document.createDocumentFragment();
      for (var h = -360; h <= 720; h += 5) {
        var maj = (h % 30 === 0);
        var el = document.createElement('div');
        el.className = 'card ' + (maj ? 'maj' : 'min');
        el.style.left = (h * PX_PER_DEG) + 'px';
        if (maj) {
          var n = ((h % 360) + 360) % 360;
          el.textContent = n === 0 ? 'N' : n === 90 ? 'E' : n === 180 ? 'S' : n === 270 ? 'W'
                          : (n / 10 | 0);
        }
        frag.appendChild(el);
      }
      compassStrip.appendChild(frag);
    })();

    /* ---------------------------------------------------------
       Helpers
       --------------------------------------------------------- */
    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

    /* write text only when it actually changed */
    function setText(el, txt) {
      if (el._t !== txt) { el._t = txt; el.textContent = txt; }
    }

    var nf = (typeof Intl !== 'undefined' && Intl.NumberFormat)
      ? new Intl.NumberFormat('en-US')
      : { format: function (n) { return String(n); } };

    /* ---------------------------------------------------------
       Cached viewport metrics (no layout reads inside the loop)
       --------------------------------------------------------- */
    var vw = window.innerWidth,
        vh = window.innerHeight,
        attH = 120;

    function measure() { attH = attitude.clientHeight || 120; }

    function onResize() {
      vw = window.innerWidth;
      vh = window.innerHeight;
      measure();
    }

    window.addEventListener('resize', onResize, { passive: true });
    window.addEventListener('orientationchange', onResize, { passive: true });
    window.addEventListener('load', measure);

    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(measure).observe(attitude);
    }
    measure();

    /* ---------------------------------------------------------
       Input
       --------------------------------------------------------- */
    var pointerId = null, originX = 0, originY = 0;
    var activePointers = 0;
    var inputX = 0, inputY = 0;
    var boostHeld = false;

    canvas.addEventListener('pointerdown', function (e) {
      activePointers++;
      if (pointerId !== null) return;          /* first finger drives, extras boost */
      pointerId = e.pointerId;
      originX = e.clientX;
      originY = e.clientY;
      if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
      hideHint();
    }, { passive: true });

    canvas.addEventListener('pointermove', function (e) {
      if (e.pointerId !== pointerId) return;
      inputX = clamp((e.clientX - originX) / (vw * 0.24), -1, 1);
      inputY = clamp((e.clientY - originY) / (vh * 0.24), -1, 1);
    }, { passive: true });

    function endPointer(e) {
      if (e.pointerId === pointerId) pointerId = null;
      if (activePointers > 0) activePointers--;
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Shift') boostHeld = true;
    });
    window.addEventListener('keyup', function (e) {
      if (e.key === 'Shift') boostHeld = false;
    });
    window.addEventListener('blur', function () {
      pointerId = null;
      activePointers = 0;
      boostHeld = false;
    });

    var hintTimer = 0, hintHidden = false;
    function hideHint() {
      if (hintHidden) return;
      hintHidden = true;
      clearTimeout(hintTimer);
      hint.classList.add('gone');
    }
    hintTimer = setTimeout(hideHint, 7000);

    /* ---------------------------------------------------------
       Flight state (demo)
       --------------------------------------------------------- */
    var state = {
      speed: 180, alt: 5200, vs: 0, heading: 45,
      pitch: 0, roll: 0, throttle: 0.35, boost: 0, g: 1
    };

    /* ---------------------------------------------------------
       Main loop
       --------------------------------------------------------- */
    var rafId = 0, last = 0, elapsed = 0;

    var lastAltTxt = null, lastLit = -1, lastHot = null, lastPct = -1;
    var lastSys = '', lastWarm = -1, lastNorm = -1;

    /* lens flare lives at the centre and is moved purely by transform */
    lens.style.left = '50%';
    lens.style.top = '50%';
    lens.style.willChange = 'transform, opacity';

    function frame(now) {
      rafId = requestAnimationFrame(frame);

      var dt = last ? (now - last) / 1000 : 0;
      last = now;
      if (dt > 0.05) dt = 0.05;
      else if (dt < 0) dt = 0;
      elapsed += dt;

      /* --- decay input when released --- */
      if (pointerId === null) {
        var decay = Math.exp(-dt * 6);
        inputX *= decay;
        inputY *= decay;
        if (inputX < 0.002 && inputX > -0.002) inputX = 0;
        if (inputY < 0.002 && inputY > -0.002) inputY = 0;
      }

      /* --- simulate aircraft --- */
      var k = 1 - Math.exp(-dt * 3.5);
      state.roll  = lerp(state.roll,  inputX * 45, k);
      state.pitch = lerp(state.pitch, -inputY * 30, k);
      state.heading = (state.heading + inputX * 40 * dt + 360) % 360;

      var boosting = boostHeld || activePointers >= 2 || inputY < -0.85;
      state.boost = lerp(state.boost, boosting ? 1 : 0, 1 - Math.exp(-dt * 4));
      state.throttle = clamp(0.35 + state.boost * 0.65 - inputY * 0.25, 0, 1);

      var targetSpeed = SPEED_MIN + state.throttle * (SPEED_MAX - SPEED_MIN);
      state.speed = lerp(state.speed, targetSpeed, 1 - Math.exp(-dt * 1.6));

      state.vs = lerp(state.vs, -state.pitch * 60, 1 - Math.exp(-dt * 2));
      state.alt = clamp(state.alt + state.vs * dt, ALT_MIN + 100, ALT_MAX - 100);
      state.g = lerp(state.g, 1 + Math.abs(state.roll) / 45 * 1.6 + state.boost * 1.2,
                     1 - Math.exp(-dt * 3));

      /* ============ SPEEDOMETER ============ */
      var sn = clamp((state.speed - SPEED_MIN) / (SPEED_MAX - SPEED_MIN), 0, 1);
      needle.style.transform = 'rotate(' + (-135 + sn * 270).toFixed(2) + 'deg)';
      arcFill.style.strokeDashoffset = (ARC_LEN * (1 - sn)).toFixed(1);
      setText(speedValue, Math.round(state.speed));
      setText(machValue, (state.speed / 660).toFixed(2));

      /* ============ ALTITUDE TAPE ============ */
      altStrip.style.transform =
        'translate3d(0,' + (state.alt * PX_PER_FT).toFixed(1) + 'px,0)';

      var altR = Math.round(state.alt);
      if (altR !== lastAltTxt) {
        lastAltTxt = altR;
        setText(altValue, nf.format(altR));
      }

      var vsR = Math.round(state.vs);
      var vsStr = (vsR >= 0 ? '+' : '') + vsR;
      setText(vsValue, vsStr);
      setText(vsValue2, vsStr);

      /* ============ ATTITUDE BALL ============ */
      var ppd = attH / 90;                     /* 90° of pitch fills the ball */
      attSphere.style.transform =
        'rotate(' + state.roll.toFixed(2) + 'deg) translateY(' +
        (state.pitch * ppd).toFixed(1) + 'px)';

      /* ============ COMPASS ============ */
      compassStrip.style.transform =
        'translate3d(' + (-state.heading * PX_PER_DEG).toFixed(1) + 'px,0,0)';
      var hdg = Math.round(state.heading) % 360;
      setText(hdgValue, ('00' + hdg).slice(-3));

      /* ============ POWER ============ */
      var pct = Math.round(state.throttle * 100);
      if (pct !== lastPct) {
        lastPct = pct;
        thrFill.style.width = pct + '%';
        setText(thrValue, pct + '%');
      }

      var lit = Math.round(state.throttle * hexes.length);
      var hot = state.boost > 0.4;
      if (lit !== lastLit || hot !== lastHot) {
        for (var i = 0; i < hexes.length; i++) {
          var on = i < lit;
          hexes[i].classList.toggle('on', on);
          hexes[i].classList.toggle('hot', on && hot);
        }
        lastLit = lit;
        lastHot = hot;
      }

      /* ============ STATUS ============ */
      setText(gValue, state.g.toFixed(1));

      var mins = (elapsed / 60) | 0;
      var secs = (elapsed % 60) | 0;
      setText(timeValue, (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs);

      var sys = state.boost > 0.5 ? 'AFTERBURN' : 'NOMINAL';
      if (sys !== lastSys) {
        lastSys = sys;
        sysState.textContent = sys;
        sysState.style.color = sys === 'AFTERBURN' ? '#ffb547' : '';
      }

      /* ============ LENS FLARE (transform/opacity only) ============ */
      var lf = state.speed / SPEED_MAX;
      lens.style.transform =
        'translate3d(' + ((0.05 + Math.sin(elapsed * 0.12) * 0.12) * vw).toFixed(1) + 'px,' +
                          ((-0.26 + Math.cos(elapsed * 0.10) * 0.06) * vh).toFixed(1) + 'px,0) ' +
        'translate(-50%,-50%) scale(' + (0.8 + lf * 0.5).toFixed(3) + ')';
      lens.style.opacity = ((0.5 + lf * 0.5) * (0.85 + state.boost * 0.15)).toFixed(3);

      /* ============ HUD TINT VARS (only when they change) ============ */
      var warm = Math.round(state.boost * 100) / 100;
      if (warm !== lastWarm) {
        lastWarm = warm;
        hud.style.setProperty('--warm', warm.toFixed(2));
      }
      var norm = Math.round(sn * 100) / 100;
      if (norm !== lastNorm) {
        lastNorm = norm;
        hud.style.setProperty('--speed-norm', norm.toFixed(2));
      }
    }

    /* ---------------------------------------------------------
       Pause when hidden, resume cleanly
       --------------------------------------------------------- */
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      } else if (!rafId) {
        last = 0;
        rafId = requestAnimationFrame(frame);
      }
    });

    rafId = requestAnimationFrame(frame);
  })();
  </script>

</body>

</html>
