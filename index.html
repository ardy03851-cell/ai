<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Builder</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0d0f;
      --surface: #141418;
      --border: #242428;
      --accent: #7c6aff;
      --accent-dim: rgba(124, 106, 255, 0.12);
      --text: #e8e8f0;
      --text-muted: #6b6b7a;
      --code: #a78bfa;
      --green: #4ade80;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 52px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.4
      }
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: #6c5ce7;
      border-color: #6c5ce7;
      color: #fff;
    }

    .btn svg {
      width: 13px;
      height: 13px;
    }

    /* Layout */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Chat panel */
    .chat-panel {
      display: flex;
      flex-direction: column;
      width: 380px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
    }

    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-role {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .msg-role.user {
      color: var(--accent);
    }

    .msg-role.ai {
      color: var(--green);
    }

    .msg-body {
      line-height: 1.6;
      color: var(--text);
      font-size: 13px;
    }

    .msg-body code {
      font-family: var(--mono);
      font-size: 11px;
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 5px;
      border-radius: 3px;
      color: var(--code);
    }

    .thinking {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }

    .loader {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .loader-bar {
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
      animation: barPulse 1.1s ease-in-out infinite;
    }

    .loader-bar:nth-child(1) {
      height: 10px;
      animation-delay: 0s;
    }

    .loader-bar:nth-child(2) {
      height: 18px;
      animation-delay: 0.12s;
    }

    .loader-bar:nth-child(3) {
      height: 12px;
      animation-delay: 0.24s;
    }

    .loader-bar:nth-child(4) {
      height: 20px;
      animation-delay: 0.36s;
    }

    .loader-bar:nth-child(5) {
      height: 8px;
      animation-delay: 0.48s;
    }

    @keyframes barPulse {

      0%,
      100% {
        opacity: 0.18;
        transform: scaleY(0.5);
      }

      50% {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    .thinking-label {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .thinking-label span {
      display: inline-block;
      animation: charFade 1.8s ease-in-out infinite;
    }

    @keyframes charFade {

      0%,
      100% {
        opacity: 0.2;
      }

      50% {
        opacity: 1;
      }
    }

    .btn-think {
      border-color: var(--border);
      color: var(--text-muted);
    }

    .btn-think.active {
      border-color: #f59e0b;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.08);
    }

    .btn-think.active .think-icon {
      filter: drop-shadow(0 0 5px rgba(245, 158, 11, 0.7));
    }

    .input-area {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 10px 12px;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 120px;
      transition: border-color 0.15s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--accent);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
      align-self: flex-end;
    }

    .send-btn:hover {
      background: #6c5ce7;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Preview panel */
    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .preview-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .preview-tabs {
      display: flex;
      gap: 2px;
    }

    .tab {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
      border: 1px solid transparent;
    }

    .tab.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(124, 106, 255, 0.3);
    }

    .tab:hover:not(.active) {
      color: var(--text);
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    .code-view {
      flex: 1;
      overflow: auto;
      padding: 20px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      color: #a8b3cf;
      white-space: pre;
    }

    .code-view::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    .code-view::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      AI Builder
    </div>
    <div class="header-actions">
      <button class="btn btn-think" id="thinkBtn" onclick="toggleThinkMode()">
        <svg class="think-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M9.663 17h4.673M12 3a6 6 0 0 1 6 6c0 2.22-1.2 4.16-3 5.2V16a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1v-1.8A6.003 6.003 0 0 1 6 9a6 6 0 0 1 6-6z"/></svg>
        Think
      </button>
      <button class="btn" id="copyBtn" onclick="copyCode()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copy HTML
    </button>
      <button class="btn btn-primary" onclick="downloadFile()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download
    </button>
    </div>
  </header>

  <div class="workspace">
    <div class="chat-panel">
      <div class="panel-header">Chat</div>
      <div class="messages" id="messages">
        <div class="msg">
          <div class="msg-role ai">AI Builder</div>
          <div class="msg-body">Ready. Describe the website you want to build — I'll generate it instantly. You can keep
            adding features, sections, or styles in follow-up messages.</div>
        </div>
      </div>
      <div class="input-area">
        <textarea id="input" placeholder="Describe your website…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
      </div>
    </div>

    <div class="preview-panel">
      <div class="preview-header">
        <div class="preview-title">Output</div>
        <div class="preview-tabs">
          <div class="tab active" onclick="switchTab('preview', this)">Preview</div>
          <div class="tab" onclick="switchTab('code', this)">HTML</div>
        </div>
      </div>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 9h18M9 21V9" />
          </svg>
        </div>
        <p>Your site will appear here</p>
      </div>
      <iframe id="previewFrame" class="hidden"></iframe>
      <div id="codeView" class="code-view hidden"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";
const API_KEY = "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";
const MODEL = "nex-agi/nex-n2-pro:free";

let currentHTML = "";
let activeTab = "preview";
let chatHistory = [];
let thinkMode = false;

const SYSTEM_PROMPT = `You are an expert web developer AI. Your job is to generate and iteratively edit complete, self-contained HTML files.

RULES:
- Always respond with a COMPLETE, valid HTML file (<!DOCTYPE html> ... </html>)
- The file must be fully self-contained: all CSS in <style>, all JS in <script>
- Make it visually impressive, modern, and professional
- When the user asks to edit/add something, take the CURRENT HTML and modify it — preserve everything that was there
- Never truncate or summarize — always output the full HTML
- Do not explain or add text outside the HTML. Output ONLY the raw HTML.
- Make designs look real and polished, not placeholder-like`;

const SYSTEM_PROMPT_THINK = `You are a sharp, concise AI assistant. Respond conversationally and directly. Think carefully before answering. Be insightful and clear — no filler, no fluff. Do not generate HTML or code unless the user explicitly asks for it.`;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function addMessage(role, text) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `<div class="msg-role ${role === 'user' ? 'user' : 'ai'}">${role === 'user' ? 'You' : 'AI Builder'}</div><div class="msg-body">${text}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function showThinking() {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg thinking';
  div.id = 'thinkingIndicator';
  const word = thinkMode ? 'Thinking' : 'Generating';
  const stagger = word.split('').map((c, i) =>
    `<span style="animation-delay:${i * 0.07}s">${c}</span>`
  ).join('');
  div.innerHTML = `
    <div class="loader">
      <div class="loader-bar"></div>
      <div class="loader-bar"></div>
      <div class="loader-bar"></div>
      <div class="loader-bar"></div>
      <div class="loader-bar"></div>
    </div>
    <div class="thinking-label">${stagger}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function toggleThinkMode() {
  thinkMode = !thinkMode;
  const btn = document.getElementById('thinkBtn');
  btn.classList.toggle('active', thinkMode);
  document.getElementById('input').placeholder = thinkMode ? 'Ask me anything…' : 'Describe your website…';
}

function removeThinking() {
  const el = document.getElementById('thinkingIndicator');
  if (el) el.remove();
}

function extractHTML(text) {
  const m = text.match(/<!DOCTYPE[\s\S]*<\/html>/i);
  if (m) return m[0];
  const m2 = text.match(/<html[\s\S]*<\/html>/i);
  if (m2) return m2[0];
  if (text.includes('<') && text.includes('>')) return text;
  return null;
}

function renderPreview(html) {
  const frame = document.getElementById('previewFrame');
  const empty = document.getElementById('emptyState');
  const codeView = document.getElementById('codeView');
  empty.classList.add('hidden');
  frame.classList.toggle('hidden', activeTab !== 'preview');
  codeView.classList.toggle('hidden', activeTab !== 'code');
  const blob = new Blob([html], { type: 'text/html' });
  frame.src = URL.createObjectURL(blob);
  codeView.textContent = html;
}

function switchTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (!currentHTML) return;
  const frame = document.getElementById('previewFrame');
  const code = document.getElementById('codeView');
  frame.classList.toggle('hidden', tab !== 'preview');
  code.classList.toggle('hidden', tab !== 'code');
}

async function sendMessage() {
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  addMessage('user', text);

  const activePrompt = thinkMode ? SYSTEM_PROMPT_THINK : SYSTEM_PROMPT;
  const userContent = (!thinkMode && currentHTML)
    ? `Current HTML:\n\`\`\`html\n${currentHTML}\n\`\`\`\n\nUser request: ${text}`
    : text;

  chatHistory.push({ role: "user", content: userContent });
  showThinking();

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
      body: JSON.stringify({ model: MODEL, messages: [{ role: "system", content: activePrompt }, ...chatHistory], max_tokens: thinkMode ? 1024 : 8000, temperature: thinkMode ? 0.85 : 0.7 })
    });

    if (res.status === 429) {
      const retry = res.headers.get('retry-after');
      const wait = retry ? `Try again in ${retry}s.` : 'Rate limited — wait ~60s and try again.';
      throw new Error(`Rate limited (429). ${wait}`);
    }
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData?.error?.message || `API error ${res.status}`);
    }
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || "";
    chatHistory.push({ role: "assistant", content: reply });

    removeThinking();

    if (thinkMode) {
      addMessage('ai', reply || "No response.");
    } else {
      const html = extractHTML(reply);
      if (html) {
        currentHTML = html;
        renderPreview(html);
        addMessage('ai', 'Site updated. Ask me to add or change anything.');
      } else {
        addMessage('ai', reply || "Something went wrong. Try again.");
      }
    }
  } catch (err) {
    removeThinking();
    const is429 = err.message.includes('429') || err.message.includes('Rate limited');
    addMessage('ai', is429
      ? `Rate limited. OpenRouter free tier allows ~50 requests/day. Wait a minute or add credits to your account.`
      : `Error: ${err.message}`);
  }

  sendBtn.disabled = false;
  input.focus();
}

function downloadFile() {
  if (!currentHTML) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([currentHTML], { type: 'text/html' }));
  a.download = 'site.html';
  a.click();
}

function copyCode() {
  if (!currentHTML) return;
  navigator.clipboard.writeText(currentHTML).then(() => {
    const btn = document.getElementById('copyBtn');
    const orig = btn.innerHTML;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied`;
    setTimeout(() => btn.innerHTML = orig, 1500);
  });
}
  </script>
</body>

</html>
