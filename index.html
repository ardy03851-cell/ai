<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Minimal Chat</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --header-bg: #0f172a;
      --user-bubble: #2563eb;
      --other-bubble: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }




    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }




    body {
      background-color: #020617;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
    }




    #app-container {
      width: 100%;
      max-width: 960px;
      height: 100%;
      max-height: 100%;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }




    @media (min-width: 768px) {
      #app-container {
        height: 92vh;
        border-radius: 12px;
        border: 1px solid var(--border-color);
      }
    }




    #auth-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: var(--bg-color);
      padding: 24px;
      text-align: center;
    }




    #auth-screen h1 {
      color: var(--text-main);
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }




    #auth-screen p {
      color: var(--text-muted);
      margin-bottom: 32px;
      font-size: 15px;
    }




    .btn-google {
      background-color: #ffffff;
      color: #0f172a;
      border: 1px solid var(--border-color);
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s ease, transform 0.1s ease;
    }




    .btn-google:hover {
      background-color: #f1f5f9;
    }




    .auth-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }




    .btn-guest {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background 0.2s ease;
    }




    .btn-guest:hover {
      background-color: var(--other-bubble);
    }




    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }




    header {
      background-color: var(--card-bg);
      color: var(--text-main);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }




    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }




    .user-profile img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-color);
    }




    .user-info {
      display: flex;
      flex-direction: column;
    }




    .user-info span {
      font-weight: 600;
      font-size: 15px;
    }




    .btn-nickname {
      background: none;
      border: none;
      color: #60a5fa;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      padding: 0;
      margin-top: 2px;
    }




    .btn-nickname:hover {
      text-decoration: underline;
    }




    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }




    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s ease, border-color 0.2s ease;
    }




    .btn-logout:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }




    #messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }




    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 80%;
    }




    .message-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }




    .message-row.received {
      align-self: flex-start;
    }




    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }




    .message {
      padding: 10px 14px;
      border-radius: 12px;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.5;
      position: relative;
    }




    .message.sent {
      background-color: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }




    .message.received {
      background-color: var(--other-bubble);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }




    .reply-quote {
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid #60a5fa;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 12px;
    }




    .reply-quote-name {
      font-weight: 600;
      color: #93c5fd;
      font-size: 11px;
    }




    .reply-quote-text {
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }




    .btn-reply-msg {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      margin-right: 6px;
      padding: 2px 4px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }




    .btn-reply-msg:hover {
      opacity: 1;
      color: var(--text-main);
    }




    #reply-preview-bar {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }




    .reply-preview-content {
      border-left: 3px solid #2563eb;
      padding-left: 8px;
      overflow: hidden;
    }




    .reply-preview-label {
      font-size: 11px;
      color: #60a5fa;
    }




    .reply-preview-text {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 500px;
    }




    .cancel-reply-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }




    .sender-name {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
    }




    .message-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      text-align: right;
    }




    .message.received .message-time {
      color: var(--text-muted);
    }




    form#chat-form {
      display: flex;
      padding: 16px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      gap: 12px;
      align-items: center;
    }




    #message-input {
      flex: 1;
      padding: 12px 18px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      background-color: var(--bg-color);
      color: var(--text-main);
    }




    #message-input:focus {
      border-color: #2563eb;
    }




    #send-btn {
      background-color: var(--user-bubble);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }




    #send-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>

<body>

  <div id="app-container">
    <div id="auth-screen">
      <h1>Simple Chat</h1>
      <p>Connect with your friends instantly</p>
      <div class="auth-buttons">
        <button class="btn-google" id="btn-login">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/>
            <path fill="#FBBC05" d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.97 4.96A9.008 9.008 0 0 0 0 9c0 1.45.35 2.82.97 4.04l2.91-2.26z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.97 4.96l2.91 2.26C4.6 5.15 6.62 3.58 9 3.58z"/>
          </svg>
          Sign in with Google
        </button>
        <button class="btn-guest" id="btn-guest-login">
          Continue as Guest
        </button>
      </div>
    </div>

    <div id="chat-screen">
      <header>
        <div class="user-profile">
          <img id="user-avatar" src="" alt="Avatar" />
          <div class="user-info">
            <span id="user-name">User</span>
            <button class="btn-nickname" id="btn-edit-nickname">Change Nickname</button>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-logout" id="btn-notify" style="display:none;">Enable Notifications</button>
          <button class="btn-logout" id="btn-logout">Sign Out</button>
        </div>
      </header>

      <div id="messages-container"></div>

      <div id="reply-preview-bar" style="display: none;">
        <div class="reply-preview-content">
          <span class="reply-preview-label">Replying to <strong id="reply-preview-name"></strong></span>
          <div id="reply-preview-text" class="reply-preview-text"></div>
        </div>
        <button type="button" id="cancel-reply-btn" class="cancel-reply-btn">&times;</button>
      </div>

      <form id="chat-form">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required />
        <button type="submit" id="send-btn">
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInAnonymously, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7BTQubCi89xzYsiw9XzjLlEBfjRE_X4M",
      authDomain: "chat-3160a.firebaseapp.com",
      projectId: "chat-3160a",
      storageBucket: "chat-3160a.firebasestorage.app",
      messagingSenderId: "246355944987",
      appId: "1:246355944987:web:f0a831e7f772921354babe",
      measurementId: "G-6VG6YRLE7Y"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // DOM Elements
    const authScreen = document.getElementById("auth-screen");
    const chatScreen = document.getElementById("chat-screen");
    const btnLogin = document.getElementById("btn-login");
    const btnGuestLogin = document.getElementById("btn-guest-login");
    const btnLogout = document.getElementById("btn-logout");
    const btnNotify = document.getElementById("btn-notify");
    const btnEditNickname = document.getElementById("btn-edit-nickname");
    const userAvatar = document.getElementById("user-avatar");
    const userName = document.getElementById("user-name");
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("message-input");
    const messagesContainer = document.getElementById("messages-container");
    const replyPreviewBar = document.getElementById("reply-preview-bar");
    const replyPreviewName = document.getElementById("reply-preview-name");
    const replyPreviewText = document.getElementById("reply-preview-text");
    const cancelReplyBtn = document.getElementById("cancel-reply-btn");

    let currentUser = null;
    let unsubscribeMessages = null;
    let selectedReply = null;
    let isInitialLoad = true;

    // Profanity Filter Regex for Guest Users
    const PROFANITY_REGEX = /\b(shit|fuck|bitch|ass|asshole|bastard|crap|damn|dick|pussy|cock|cunt|slut|whore|piss|fag|nigger|retard)\b/i;

    function isProfane(text) {
      return PROFANITY_REGEX.test(text);
    }

    // Notification Setup for iPad / Mobile Browsers
    function setupNotifications() {
      if (!("Notification" in window)) return;
      if (Notification.permission === "default") {
        btnNotify.style.display = "inline-block";
      } else {
        btnNotify.style.display = "none";
      }
    }

    btnNotify.addEventListener("click", async () => {
      if ("Notification" in window) {
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          btnNotify.style.display = "none";
        }
      }
    });

    // Authentication Listener
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        const defaultName = user.isAnonymous ? "Guest User" : "User";
        userName.textContent = user.displayName || defaultName;
        userAvatar.src = user.photoURL || "https://via.placeholder.com/40";
        authScreen.style.display = "none";
        chatScreen.style.display = "flex";
        setupNotifications();
        loadMessages();
      } else {
        currentUser = null;
        if (unsubscribeMessages) unsubscribeMessages();
        authScreen.style.display = "flex";
        chatScreen.style.display = "none";
        messagesContainer.innerHTML = "";
        clearReply();
      }
    });

    // Login Event
    btnLogin.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Login failed:", error);
        alert("Authentication failed. Make sure Google Auth is enabled in Firebase Console.");
      }
    });

    // Guest Login Event
    btnGuestLogin.addEventListener("click", async () => {
      try {
        await signInAnonymously(auth);
      } catch (error) {
        console.error("Guest login failed:", error);
        alert("Guest login failed. Make sure Anonymous Sign-in is enabled in Firebase Console under Authentication -> Sign-in method.");
      }
    });

    // Logout Event
    btnLogout.addEventListener("click", () => signOut(auth));

    // Change Nickname Event
    btnEditNickname.addEventListener("click", async () => {
      const newNickname = prompt("Enter your new nickname:", currentUser.displayName || "");
      if (newNickname && newNickname.trim() !== "") {
        try {
          await updateProfile(auth.currentUser, { displayName: newNickname.trim() });
          userName.textContent = newNickname.trim();
        } catch (error) {
          console.error("Error updating nickname:", error);
          alert("Failed to update nickname.");
        }
      }
    });

    // Reply Handling
    function setReply(displayName, text) {
      selectedReply = { displayName, text };
      replyPreviewName.textContent = displayName;
      replyPreviewText.textContent = text;
      replyPreviewBar.style.display = "flex";
      messageInput.focus();
    }

    function clearReply() {
      selectedReply = null;
      replyPreviewBar.style.display = "none";
      replyPreviewName.textContent = "";
      replyPreviewText.textContent = "";
    }

    cancelReplyBtn.addEventListener("click", clearReply);

    // Send Message
    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !currentUser) return;

      if (currentUser.isAnonymous && isProfane(text)) {
        alert("Guest users are restricted from sending messages with explicit or profane language. Please rephrase your message or sign in with Google.");
        return;
      }

      const msgPayload = {
        text: text,
        uid: currentUser.uid,
        displayName: currentUser.displayName || (currentUser.isAnonymous ? "Guest User" : "Anonymous"),
        photoURL: currentUser.photoURL || "https://via.placeholder.com/40",
        createdAt: serverTimestamp()
      };

      if (selectedReply) {
        msgPayload.replyTo = selectedReply;
      }

      messageInput.value = "";
      clearReply();

      try {
        await addDoc(collection(db, "messages"), msgPayload);
      } catch (error) {
        console.error("Error sending message:", error);
      }
    });

    // Real-Time Messages Listener
    function loadMessages() {
      const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
      isInitialLoad = true;
      
      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        messagesContainer.innerHTML = "";
        
        snapshot.forEach((doc) => {
          const data = doc.data();
          const isSent = data.uid === currentUser.uid;
          
          const rowDiv = document.createElement("div");
          rowDiv.className = `message-row ${isSent ? "sent" : "received"}`;
          
          const time = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
          const avatarImg = `<img class="msg-avatar" src="${escapeHTML(data.photoURL || "https://via.placeholder.com/32")}" alt="Profile Picture" />`;

          let replyHTML = "";
          if (data.replyTo) {
            replyHTML = `
              <div class="reply-quote">
                <div class="reply-quote-name">${escapeHTML(data.replyTo.displayName)}</div>
                <div class="reply-quote-text">${escapeHTML(data.replyTo.text)}</div>
              </div>
            `;
          }

          const messageDiv = document.createElement("div");
          messageDiv.className = `message ${isSent ? "sent" : "received"}`;
          messageDiv.innerHTML = `
            ${replyHTML}
            ${!isSent ? `<div class="sender-name">${escapeHTML(data.displayName)}</div>` : ''}
            <div>${escapeHTML(data.text)}</div>
            <div style="display: flex; justify-content: flex-end; align-items: center; margin-top: 4px;">
              <button class="btn-reply-msg" type="button">Reply</button>
              <span class="message-time">${time}</span>
            </div>
          `;

          const replyBtn = messageDiv.querySelector(".btn-reply-msg");
          replyBtn.addEventListener("click", () => {
            setReply(data.displayName || "User", data.text);
          });

          rowDiv.innerHTML = avatarImg;
          rowDiv.appendChild(messageDiv);
          messagesContainer.appendChild(rowDiv);
        });

        // Trigger Notification for incoming messages
        if (!isInitialLoad && !snapshot.metadata.hasPendingWrites) {
          const lastDoc = snapshot.docs[snapshot.docs.length - 1];
          if (lastDoc) {
            const lastData = lastDoc.data();
            if (lastData.uid !== currentUser.uid && "Notification" in window && Notification.permission === "granted") {
              new Notification(lastData.displayName || "New Message", {
                body: lastData.text,
                icon: lastData.photoURL || undefined
              });
            }
          }
        }

        isInitialLoad = false;

        // Auto-scroll to latest message
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
    }

    // Helper to sanitize HTML inputs
    function escapeHTML(str) {
      return str ? str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      ) : '';
    }
  </script>
</body>

</html>
