<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05090d">
  <title>Sky Drift</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <canvas id="scene"></canvas>

  <!-- ============================================================
       HUD  —  all shapes drawn with CSS gradients, masks,
       conic wedges, clip-paths and a small SVG gauge.
       ============================================================ -->
  <div id="hud">

    <!-- ambient overlays -->
    <div class="fx fx-vignette"></div>
    <div class="fx fx-scanlines"></div>

    <div class="fx-lens" id="lensflare" aria-hidden="true">
      <i class="lens-core"></i>
      <i class="lens-halo"></i>
      <i class="lens-ghost g1"></i>
      <i class="lens-ghost g2"></i>
      <i class="lens-ghost g3"></i>
      <i class="lens-streak"></i>
    </div>

    <!-- corner brackets -->
    <span class="bracket tl"></span>
    <span class="bracket tr"></span>
    <span class="bracket bl"></span>
    <span class="bracket br"></span>

    <!-- ==================== AIRSPEED GAUGE ==================== -->
    <section class="gauge speedo" id="speedo">
      <span class="ring ring-a"></span>
      <span class="ring ring-b"></span>
      <span class="ring ring-c"></span>

      <svg class="dial" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="gradSpeed" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%"   stop-color="#3ce9ff"/>
            <stop offset="55%"  stop-color="#a6f7ff"/>
            <stop offset="100%" stop-color="#ffb547"/>
          </linearGradient>
          <linearGradient id="gradRed" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#ff6a3a"/>
            <stop offset="100%" stop-color="#ff2a2a"/>
          </linearGradient>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="3.2" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- 270° arc from 135° → 45°, r = 80, centre (100,100) -->
        <path class="arc-bg"   d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"/>
        <path class="arc-red"  d="M 127.92 33.02 A 80 80 0 0 1 156.57 156.57"/>
        <path class="arc-fill" id="arcFill"
              d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"/>
      </svg>

      <span class="ticks ticks-minor"></span>
      <span class="ticks ticks-major"></span>

      <span class="needle" id="needle"><i></i></span>
      <span class="hub"></span>

      <div class="readout">
        <span class="value" id="speedValue">0</span>
        <span class="unit">KTS</span>
      </div>
      <div class="mach">MACH <b id="machValue">0.00</b></div>
      <div class="caption">AIRSPEED</div>
    </section>

    <!-- ==================== ALTITUDE TAPE ==================== -->
    <section class="alt">
      <div class="alt-window">
        <div class="alt-strip" id="altStrip"></div>
      </div>
      <span class="alt-pointer"></span>
      <div class="alt-num">
        <span id="altValue">0</span><i>FT</i>
      </div>
      <div class="alt-vs"><span id="vsValue">+0</span><i>FPM</i></div>
      <div class="caption v">ALT</div>
    </section>

    <!-- ==================== ATTITUDE BALL ==================== -->
    <section class="attitude" id="attitude">
      <div class="att-sphere" id="attSphere">
        <div class="att-sky"></div>
        <div class="att-ground"></div>
        <div class="att-ladder">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="att-glow"></div>
      </div>
      <span class="att-frame"></span>
      <span class="att-wing"></span>
      <span class="att-dot"></span>
      <div class="caption v">ATTITUDE</div>
    </section>

    <!-- ==================== COMPASS RIBBON ==================== -->
    <section class="compass">
      <div class="compass-window">
        <div class="compass-strip" id="compassStrip"></div>
      </div>
      <span class="compass-mark"></span>
      <div class="compass-num"><span id="hdgValue">000</span>°</div>
    </section>

    <!-- ==================== THROTTLE / BOOST ==================== -->
    <section class="power">
      <div class="pwr-head">
        <span class="pwr-cap">THROTTLE</span>
        <span class="pwr-num" id="thrValue">0%</span>
      </div>
      <div class="pwr-bar">
        <span class="pwr-fill" id="thrFill"></span>
        <span class="pwr-notches"></span>
      </div>
      <div class="hex-row" id="hexRow">
        <span class="hex"></span><span class="hex"></span><span class="hex"></span>
        <span class="hex"></span><span class="hex"></span><span class="hex"></span>
      </div>
      <div class="pwr-cap small">AFTERBURNER</div>
    </section>

    <!-- ==================== STATUS ==================== -->
    <section class="status">
      <div class="st-line"><b>SYS</b><span class="ok" id="sysState">NOMINAL</span></div>
      <div class="st-line"><b>G</b><span id="gValue">1.0</span></div>
      <div class="st-line"><b>V/S</b><span id="vsValue2">+0</span></div>
      <div class="st-line"><b>TIME</b><span id="timeValue">00:00</span></div>
    </section>

    <!-- ==================== HINT ==================== -->
    <div id="hint">
      <span class="hint-main">DRAG TO FLY</span>
      <span class="hint-sub">HOLD <b>SHIFT</b> / <b>TWO FINGERS</b> FOR AFTERBURNER</span>
    </div>

  </div>

  <!-- ============================================================
       DEMO DRIVER  —  replace with your own game.js later.
       Wires up the HUD so all animations come alive immediately.
       ============================================================ -->
  <script>
  (function () {
    "use strict";

    /* ---------- build altitude tape ---------- */
    var altStrip = document.getElementById('altStrip');
    var PX_PER_FT = 0.22;
    var ALT_MIN = -1000, ALT_MAX = 30000, ALT_STEP = 100;
    var frag = document.createDocumentFragment();
    for (var a = ALT_MIN; a <= ALT_MAX; a += ALT_STEP) {
      var t = document.createElement('div');
      t.className = 'tick ' + (a % 500 === 0 ? 'maj' : 'min');
      t.style.top = (-a * PX_PER_FT) + 'px';
      t.textContent = (a % 500 === 0) ? a : '';
      frag.appendChild(t);
    }
    altStrip.appendChild(frag);

    /* ---------- build compass ribbon ---------- */
    var compassStrip = document.getElementById('compassStrip');
    var PX_PER_DEG = 4;
    frag = document.createDocumentFragment();
    for (var h = -360; h <= 720; h += 5) {
      var c = document.createElement('div');
      var maj = (h % 30 === 0);
      c.className = 'card ' + (maj ? 'maj' : 'min');
      c.style.left = (h * PX_PER_DEG) + 'px';
      if (maj) {
        var norm = ((h % 360) + 360) % 360;
        var lbl = norm === 0 ? 'N' : norm === 90 ? 'E' : norm === 180 ? 'S' : norm === 270 ? 'W'
                : (norm / 10 | 0);
        c.textContent = lbl;
      }
      frag.appendChild(c);
    }
    compassStrip.appendChild(frag);

    /* ---------- cached elements ---------- */
    var needle      = document.getElementById('needle');
    var arcFill     = document.getElementById('arcFill');
    var speedValue  = document.getElementById('speedValue');
    var machValue   = document.getElementById('machValue');
    var altValue    = document.getElementById('altValue');
    var vsValue     = document.getElementById('vsValue');
    var vsValue2    = document.getElementById('vsValue2');
    var hdgValue    = document.getElementById('hdgValue');
    var hdgValue2   = document.getElementById('hdgValue2');
    var attSphere   = document.getElementById('attSphere');
    var attitude    = document.getElementById('attitude');
    var thrFill     = document.getElementById('thrFill');
    var thrValue    = document.getElementById('thrValue');
    var hexes       = document.querySelectorAll('#hexRow .hex');
    var gValue      = document.getElementById('gValue');
    var timeValue   = document.getElementById('timeValue');
    var sysState    = document.getElementById('sysState');
    var lens        = document.getElementById('lensflare');
    var hint        = document.getElementById('hint');
    var hud         = document.getElementById('hud');

    /* ---------- flight state (demo) ---------- */
    var state = {
      speed: 180, alt: 5200, vs: 0, heading: 45,
      pitch: 0, roll: 0, throttle: 0.35, boost: 0,
      g: 1
    };

    var ARC_LEN = 377;      /* length of the 270° arc, r=80 */
    var SPEED_MIN = 60, SPEED_MAX = 420;

    /* ---------- input ---------- */
    var pointerId = null, ox = 0, oy = 0;
    var inputX = 0, inputY = 0;
    var boostHeld = false;

    var canvas = document.getElementById('scene');

    canvas.addEventListener('pointerdown', function (e) {
      if (pointerId !== null) return;
      pointerId = e.pointerId;
      ox = e.clientX; oy = e.clientY;
      if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
      hideHint();
    }, { passive: true });

    canvas.addEventListener('pointermove', function (e) {
      if (e.pointerId !== pointerId) return;
      inputX = Math.max(-1, Math.min(1, (e.clientX - ox) / (window.innerWidth  * 0.24)));
      inputY = Math.max(-1, Math.min(1, (e.clientY - oy) / (window.innerHeight * 0.24)));
    }, { passive: true });

    function endPointer(e) {
      if (e.pointerId !== pointerId) return;
      pointerId = null;
    }
    canvas.addEventListener('pointerup',     endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('pointerleave',  endPointer);

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Shift') boostHeld = true;
    });
    window.addEventListener('keyup', function (e) {
      if (e.key === 'Shift') boostHeld = false;
    });

    var hintHidden = false;
    function hideHint() {
      if (hintHidden) return;
      hintHidden = true;
      hint.classList.add('gone');
    }
    setTimeout(hideHint, 7000);

    /* ---------- helpers ---------- */
    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function fmt(n, d) { return n.toFixed(d === undefined ? 0 : d); }

    /* ---------- main loop ---------- */
    var last = performance.now();
    var elapsed = 0;
    var attH = attitude.clientHeight || 120;
    var PX_PER_DEG_PITCH = attH / 90;   /* 90° of pitch fills the ball */

    function frame(now) {
      requestAnimationFrame(frame);
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      elapsed += dt;

      /* --- decay input when released --- */
      if (pointerId === null) {
        var d = Math.exp(-dt * 6);
        inputX *= d; inputY *= d;
        if (Math.abs(inputX) < 0.002) inputX = 0;
        if (Math.abs(inputY) < 0.002) inputY = 0;
      }

      /* --- simulate aircraft --- */
      state.roll  = lerp(state.roll,  inputX * 45, 1 - Math.exp(-dt * 3.5));
      state.pitch = lerp(state.pitch, -inputY * 30, 1 - Math.exp(-dt * 3.5));
      state.heading = (state.heading + inputX * 40 * dt + 360) % 360;

      var boosting = boostHeld || inputY < -0.85;
      state.boost = lerp(state.boost, boosting ? 1 : 0, 1 - Math.exp(-dt * 4));
      state.throttle = clamp(0.35 + state.boost * 0.65 + (-inputY) * 0.25, 0, 1);

      var targetSpeed = SPEED_MIN + state.throttle * (SPEED_MAX - SPEED_MIN);
      state.speed = lerp(state.speed, targetSpeed, 1 - Math.exp(-dt * 1.6));

      state.vs = lerp(state.vs, -state.pitch * 60, 1 - Math.exp(-dt * 2));
      state.alt = clamp(state.alt + state.vs * dt, ALT_MIN + 100, ALT_MAX - 100);
      state.g = lerp(state.g, 1 + Math.abs(state.roll) / 45 * 1.6 + state.boost * 1.2,
                     1 - Math.exp(-dt * 3));

      /* ============ SPEEDOMETER ============ */
      var sn = clamp((state.speed - SPEED_MIN) / (SPEED_MAX - SPEED_MIN), 0, 1);
      needle.style.transform = 'rotate(' + (-135 + sn * 270) + 'deg)';
      arcFill.style.strokeDashoffset = (ARC_LEN * (1 - sn)).toFixed(1);
      speedValue.textContent = Math.round(state.speed);
      machValue.textContent = (state.speed / 660).toFixed(2);

      /* ============ ALTITUDE TAPE ============ */
      altStrip.style.transform = 'translateY(' + (state.alt * PX_PER_FT) + 'px)';
      altValue.textContent = Math.round(state.alt).toLocaleString();
      var vsStr = (state.vs >= 0 ? '+' : '') + Math.round(state.vs);
      vsValue.textContent = vsStr;
      vsValue2.textContent = vsStr;

      /* ============ ATTITUDE BALL ============ */
      var attHNow = attitude.clientHeight || 120;
      var ppd = attHNow / 90;
      attSphere.style.transform =
        'rotate(' + state.roll + 'deg) translateY(' + (state.pitch * ppd) + 'px)';

      /* ============ COMPASS ============ */
      compassStrip.style.transform = 'translateX(' + (-state.heading * PX_PER_DEG) + 'px)';
      var hdg = Math.round(state.heading) % 360;
      var pad3 = ('00' + hdg).slice(-3);
      hdgValue.textContent = pad3;
      hdgValue2.textContent = pad3;

      /* ============ POWER ============ */
      var pct = Math.round(state.throttle * 100);
      thrFill.style.width = pct + '%';
      thrValue.textContent = pct + '%';
      var lit = Math.round(state.throttle * hexes.length);
      for (var i = 0; i < hexes.length; i++) {
        hexes[i].classList.toggle('on',  i < lit);
        hexes[i].classList.toggle('hot', i < lit && state.boost > 0.4);
      }

      /* ============ STATUS ============ */
      gValue.textContent = fmt(state.g, 1);
      var m = Math.floor(elapsed / 60);
      var s = Math.floor(elapsed % 60);
      timeValue.textContent = ('0' + m).slice(-2) + ':' + ('0' + s).slice(-2);
      sysState.textContent = state.boost > 0.5 ? 'AFTERBURN' : 'NOMINAL';
      sysState.style.color = state.boost > 0.5 ? '#ffb547' : '';

      /* ============ LENS FLARE ============ */
      var lf = state.speed / SPEED_MAX;
      lens.style.left = (55 + Math.sin(elapsed * 0.12) * 12) + '%';
      lens.style.top  = (24 + Math.cos(elapsed * 0.10) * 6) + '%';
      lens.style.opacity = (0.5 + lf * 0.5) * (0.85 + state.boost * 0.15);
      lens.style.transform = 'translate(-50%, -50%) scale(' + (0.8 + lf * 0.5) + ')';

      /* ============ HUD WARM TINT on boost ============ */
      hud.style.setProperty('--warm', state.boost.toFixed(3));
      hud.style.setProperty('--speed-norm', sn.toFixed(3));
    }

    requestAnimationFrame(frame);
  })();
  </script>

</body>

</html>
